name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Unzip project
        run: |
          ZIP=$(ls -t *.zip | head -n1)
          mkdir -p _unz
          unzip -o -q "$ZIP" -d _unz
          CFG=$(find _unz -name capacitor.config.json -not -path "*/node_modules/*" | head -n1)
          [ -n "$CFG" ] || { echo "capacitor.config.json not found"; exit 1; }
          echo "PROJECT=$(dirname "$CFG")" >> "$GITHUB_ENV"

      - name: Bundle Three.js for offline play
        working-directory: ${{ env.PROJECT }}
        run: |
          mkdir -p www/lib
          curl -fsSL https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js -o www/lib/three.min.js

      - name: Install Capacitor and add Android platform
        working-directory: ${{ env.PROJECT }}
        run: |
          npm install
          npx cap add android

      - name: Generate app icon and splash
        working-directory: ${{ env.PROJECT }}
        run: |
          if [ -f assets/icon-only.png ]; then npx --yes @capacitor/assets generate --android; fi

      - name: Lock landscape
        working-directory: ${{ env.PROJECT }}
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q screenOrientation "$M" || perl -0pi -e 's/<activity\b/<activity android:screenOrientation="sensorLandscape"/' "$M"

      - name: Sync web assets
        working-directory: ${{ env.PROJECT }}
        run: npx cap sync android

      - name: Build debug APK
        working-directory: ${{ env.PROJECT }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: the-last-save-debug-apk
          path: ${{ env.PROJECT }}/android/app/build/outputs/apk/debug/*.apk

      - name: Build and sign release APK
        if: env.HAS_KEYSTORE == 'true'
        working-directory: ${{ env.PROJECT }}/android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > ../release.jks
          ./gradlew assembleRelease --no-daemon
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | tail -n1)
          UNSIGNED=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          $APKSIGNER sign --ks ../release.jks --ks-pass pass:$KS_PASS --key-pass pass:$KEY_PASS --ks-key-alias $KEY_ALIAS --out app/build/outputs/apk/release/the-last-save-release.apk "$UNSIGNED"

      - uses: actions/upload-artifact@v4
        if: env.HAS_KEYSTORE == 'true'
        with:
          name: the-last-save-release-apk
          path: ${{ env.PROJECT }}/android/app/build/outputs/apk/release/the-last-save-release.apk
